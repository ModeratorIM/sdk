name: publish-pypi

# MANUAL publish of `moderatorim-sdk` to PyPI. This workflow is deliberately NOT automated: it has
# no tag / release / push trigger. A human runs it from the Actions tab (Run workflow), which is the
# only way it fires. The default is a DRY RUN — it builds and validates the artifacts but does not
# upload — so the wiring can be exercised safely; set `dry_run: false` to actually publish.
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API token is stored. Before the first REAL
# publish, a maintainer registers this repo + this workflow as a trusted publisher on PyPI
# (https://pypi.org/manage/account/publishing/): PyPI project `moderatorim-sdk`, owner `ModeratorIM`,
# repo `sdk`, workflow `publish-pypi.yml`, environment `pypi`. Until then, dry runs work; a real
# publish will fail at the upload step with an auth error (expected — it means the trusted-publisher
# registration is still pending, NOT a workflow bug).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only (do NOT upload to PyPI)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing — no stored PyPI token needed
      contents: read
    steps:
      - name: Check out the SDK
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          echo "Built artifacts:"
          ls -l dist

      - name: Validate the artifacts
        run: twine check dist/*

      - name: Publish to PyPI (skipped on a dry run)
        if: ${{ inputs.dry_run == false }}
        uses: pypa/gh-action-pypi-publish@release/v1
