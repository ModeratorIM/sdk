[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "moderatorim-sdk"
version = "0.3.0"
description = "ModeratorIM app SDK — the contract kernel external apps build against (Manifest, models, the DataStore port, the App/Ctx/Page routing facade, and the event bus). Ships no runtime; core implements it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Kenson" }]
keywords = ["moderatorim", "sdk", "app", "plugin", "contracts"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 1 - Planning",
]
# The SDK is a CONTRACT kernel — declarations only, no runtime. It deliberately pulls in NO heavy
# dependencies (no starlette, no asyncpg): an external app installs this alone to author against it.
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.9.6",
    "mypy==1.15.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]
docs = [
    "griffe2md>=1.5,<2",
]

[project.urls]
Homepage = "https://moderatorim.com"

[project.scripts]
# The `moderatorim` CLI (scaffolds apps: create app / generate …). Lives at moderatorim.cli — a
# sibling of moderatorim.sdk, SDK-owned by convention. See the sdk-cli spec.
moderatorim = "moderatorim.cli:main"

[tool.hatch.build.targets.wheel]
# Ship the moderatorim.sdk subpackage. No src/moderatorim/__init__.py exists — `moderatorim` is a
# PEP 420 namespace shared with moderatorim-core, so neither package owns the namespace root.
packages = ["src/moderatorim"]

# Ship the CLI's template files (non-.py data: .tmpl, plain __init__.py stubs) in the wheel so
# `moderatorim create app` can render them at runtime.
[tool.hatch.build.targets.wheel.force-include]
"src/moderatorim/cli/templates" = "moderatorim/cli/templates"
# Ship the moderatorim.ui front-end assets (BeerCSS/MDC/htmx, base + theme CSS, component-behavior
# JS) as package data — the component library carries its own default design + behavior. A host
# locates them via moderatorim.ui.ui_asset_dir() and serves them at a URL it owns.
"src/moderatorim/ui/static" = "moderatorim/ui/static"

# ---------------------------------------------------------------------------
# Tooling config (mirrors moderatorim-core)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["moderatorim"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["griffe2md", "griffe"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["moderatorim.sdk"]
branch = true
